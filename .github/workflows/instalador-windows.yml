name: Instalador Windows

on:
  push:
    branches: [claude/demolition-plans-automation-h0etwe, main]
    paths: [ortofoto/**, instalador/**, requirements.txt, .github/workflows/instalador-windows.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Pruebas
        run: python -m pytest -q tests

      - name: Compilar programa (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name TopografiaMetrados --paths .
          --add-data "ortofoto/codigos.json;ortofoto"
          --collect-all rasterio --collect-all shapely
          --collect-submodules ezdxf --hidden-import openpyxl
          instalador/topografia_app.py

      - name: Probar el ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TopografiaMetrados\TopografiaMetrados.exe" -ArgumentList "--prueba","$env:RUNNER_TEMP\prueba" -Wait -PassThru
          Get-ChildItem "$env:RUNNER_TEMP\prueba"
          if (-not (Test-Path "$env:RUNNER_TEMP\prueba\PRUEBA_OK.txt")) { throw "El ejecutable no paso la prueba (codigo $($p.ExitCode))" }

      - name: Crear instalador (Inno Setup)
        shell: pwsh
        run: |
          $env:VERSION_APP = "1.0.$env:GITHUB_RUN_NUMBER"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" instalador\instalador.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Instalar_TopografiaMetrados
          path: dist_instalador/Instalar_TopografiaMetrados.exe

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: instalador-v1.0.${{ github.run_number }}
          name: Instalador Topografia - Metrados v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist_instalador/Instalar_TopografiaMetrados.exe
          body: |
            Descargue **Instalar_TopografiaMetrados.exe**, abralo y siga los pasos (Siguiente > Siguiente > Instalar).
            No necesita Python. Queda un acceso directo en el escritorio.
